name: CI - Smart Twin IE

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  test-windows:
    name: Test on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # Garante que o LFS baixe os modelos reais

      # --- Backend & Frontend (Node.js) ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Backend Deps
        run: |
          cd backend
          npm install
      
      - name: Run Backend Health Check
        run: |
          cd backend
          npm test

      - name: Install Frontend Deps
        run: |
          cd frontend
          npm install
      
      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      # --- IA Service (Python) ---
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install IA Deps
        run: |
          cd ai-service
          pip install -r requirements.txt
      
      - name: Run IA Model Load Test
        run: |
          cd ai-service
          python test_model_load.py
