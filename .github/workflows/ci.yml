name: CI & Deploy Quality Gate

on:
  push:
    branches: [ master, main, develop, 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ master, main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend (Node.js 22 & Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run test # tsc --noEmit && vitest run

      - name: Build Backend Artifacts
        run: npm run build

  frontend-ci:
    name: Frontend (React 19 & Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Build Frontend (Vite)
        run: npm run build

  ai-service-ci:
    name: AI Service (Python 3.11 & Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            ai-service/requirements.txt
            ai-service/requirements-dev.txt

      - name: Install System Dependencies for GDAL/OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 gdal-bin libgdal-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run AI Unit Tests
        run: pytest -v

  deploy-and-docker-ci:
    name: Deploy Integrity & Docker Build
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, ai-service-ci]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Backend & Frontend Dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Run Deploy Validation Script
        run: ./scripts/test-deploy.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build AI Service Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          push: false
          tags: smart-twin-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
